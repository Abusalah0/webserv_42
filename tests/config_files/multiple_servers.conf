http {
    root /var/www;
    client_max_body_size 10M;
    
    server {
        listen 0.0.0.0:80;
        server_name example.com www.example.com;
        root /var/www/example;
    }
    
    server {
        listen 0.0.0.0:8080;
        server_name test.com;
        root /var/www/test;
        autoindex off;
    }
    
    server {
        listen 0.0.0.0:443;
        server_name secure.com;
        root /var/www/secure;
    }
}
