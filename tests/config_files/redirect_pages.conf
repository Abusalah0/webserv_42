http {
    root /var/www;
    
    server {
        listen 0.0.0.0:80;
        server_name example.com;
        redirect 301 /permanent-redirect;
        redirect 302 /temporary-redirect;
        
        location /old {
            redirect 301 /new;
        }
        
        location /temp {
            redirect 302 /temporary;
        }
    }
}
