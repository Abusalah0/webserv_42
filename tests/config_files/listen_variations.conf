http {
    root /var/www;
    
    server {
        listen 80;
        listen 443;
        listen 0.0.0.0:8080;
        listen 127.0.0.1:9000;
        listen localhost:3000;
        server_name example.com;
    }
    
    server {
        listen 8000;
        listen 192.168.1.1:8001;
        server_name test.com;
    }
}
