# This is a comment
http {
    # Global settings
    root /var/www;  # Document root
    autoindex on;   # Enable directory listing
    
    # Error pages configuration
    error_page 404 /404.html;  # Not found page
    
    server {
        # Server configuration
        listen 80;              # Listen on port 80
        server_name example.com; # Server name
        
        # Location block
        location / {
            root /var/www/public;  # Location root
            limit GET POST;        # Allowed methods
        }
    }
    # End of server block
}
# End of configuration
