http {
    root /var/www;
    index index.html index.htm default.html;
    
    server {
        listen 80;
        server_name example.com;
        index index.php index.html;
        
        location / {
            root /var/www/public;
            index home.html index.html;
        }
        
        location /admin {
            root /var/www/admin;
            index admin.php admin.html;
        }
        
        location /api {
            root /var/www/api;
            index api.json index.json;
        }
    }
}
