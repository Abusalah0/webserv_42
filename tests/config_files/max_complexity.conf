http {
    root /var/www/global;
    autoindex on;
    client_max_body_size 100M;
    index index.html index.htm default.html;
    error_page 404 500 502 503 504 /error.html;
    redirect 301 /old-path;
    redirect 302 /temp-path;
    
    server {
        listen 80;
        listen 443;
        listen 0.0.0.0:8080;
        listen 127.0.0.1:9000;
        server_name example.com www.example.com blog.example.com api.example.com;
        root /var/www/example;
        autoindex off;
        client_max_body_size 50M;
        index main.html index.php;
        error_page 403 404 /custom_error.html;
        redirect 301 /server-redirect;
        
        location / {
            root /var/www/example/public;
            autoindex on;
            client_max_body_size 10M;
            index home.html;
            error_page 404 /404.html;
            redirect 302 /home-redirect;
            limit GET POST;
            cgi /usr/bin/php;
            upload_path /tmp/uploads;
        }
        
        location /api {
            root /var/www/example/api;
            autoindex off;
            client_max_body_size 5M;
            index api.json;
            error_page 500 /api_error.html;
            limit GET POST PUT DELETE;
            cgi /usr/bin/python;
            upload_path /tmp/api_uploads;
        }
        
        location /admin {
            root /var/www/example/admin;
            client_max_body_size 1M;
            index admin.php admin.html;
            error_page 401 403 /admin_error.html;
            redirect 301 /admin-new;
            limit GET POST;
            cgi /usr/bin/php;
        }
        
        location /uploads {
            root /var/www/example/uploads;
            limit POST PUT;
            upload_path /var/uploads;
            cgi /bin/upload_handler;
        }
        
        location /static {
            root /var/www/example/static;
            autoindex on;
            limit GET;
        }
    }
    
    server {
        listen 8000;
        listen 8443;
        server_name test.com api.test.com;
        root /var/www/test;
        client_max_body_size 20M;
        error_page 404 /test_404.html;
        
        location /test {
            root /var/www/test/public;
            limit GET POST DELETE;
            cgi /usr/bin/test_handler;
        }
    }
    
    server {
        listen 9000;
        server_name dev.com;
        root /var/www/dev;
        autoindex on;
        
        location /dev {
            root /var/www/dev/public;
            limit GET;
        }
        
        location /debug {
            root /var/www/dev/debug;
            limit GET POST;
            cgi /usr/bin/debug;
        }
    }
}
