http {
    root /var/www;
    
    server {
        listen 80;
        server_name example.com;
        
        location / {
            root /var/www/public;
            limit GET;
        }
        
        location /api {
            root /var/www/api;
            limit GET POST;
        }
        
        location /admin {
            root /var/www/admin;
            limit GET POST PUT DELETE;
        }
        
        location /upload {
            root /var/www/uploads;
            limit POST PUT;
        }
        
        location /read-only {
            root /var/www/readonly;
            limit GET;
        }
    }
}
