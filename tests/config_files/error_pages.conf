http {
    root /var/www;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    server {
        listen 80;
        server_name example.com;
        error_page 403 /forbidden.html;
        error_page 404 /custom404.html;
        
        location / {
            root /var/www/public;
            error_page 404 /location404.html;
        }
        
        location /admin {
            root /var/www/admin;
            error_page 401 403 /admin_error.html;
        }
    }
}
