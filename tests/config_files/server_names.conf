http {
    root /var/www;
    
    server {
        listen 80;
        server_name example.com www.example.com blog.example.com;
    }
    
    server {
        listen 8080;
        server_name test.com;
        server_name api.test.com;
        server_name admin.test.com;
    }
    
    server {
        listen 443;
        server_name secure.com ssl.secure.com https.secure.com;
    }
}
