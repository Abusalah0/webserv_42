http {
    server {
        listen 127.0.0.1:18080;
        server_name localhost;

        location / {
            root /home/user/webserv_42/tester/www;
            autoindex on;
            limit GET POST;
        }

        location /post {
            root /home/user/webserv_42/tester/www;
            limit POST;
            client_max_body_size 1024;
        }

        location /delete {
            root /home/user/webserv_42/tester/www;
            limit DELETE;
        }

        location /cgi_py {
            root /home/user/webserv_42/tester/www/cgi;
            cgi_pass /usr/bin/python3;
            cgi_extension .py;
            autoindex on;
        }

        location /cgi_exec {
            root /home/user/webserv_42/tests/www/cgi;
            cgi_pass executable;
            cgi_extension .cgi;
            autoindex on;
        }
    }
}
